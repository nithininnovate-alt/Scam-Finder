openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /webhooks/resend:
    post:
      operationId: receiveResendDeliveryEvent
      summary: Receive signature-verified email delivery metadata
      description: Provider-only callback. Requires Svix signature headers over the raw JSON bytes, within five minutes. No account credentials. Maximum 32 KiB; compressed payloads are rejected. Supported metadata expires within 30 days. Never changes cases or sends alerts.
      security: []
      parameters:
        - {name: svix-id, in: header, required: true, schema: {type: string, maxLength: 200}}
        - {name: svix-timestamp, in: header, required: true, schema: {type: string}}
        - {name: svix-signature, in: header, required: true, schema: {type: string, maxLength: 2048}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResendEventInput"}
      responses:
        "200":
          description: Event recorded, already recorded, expired or intentionally ignored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebhookReceipt"}
        "400": {description: "Invalid signature, timestamp or event"}
        "413": {description: Payload exceeds limit}
        "415": {description: Unsupported content type or compression}
        "429": {description: Rate limited}
        "500": {description: Storage failed; retry the callback}
        "503": {description: Webhook signing secret not configured}
  /account/notifications:
    get:
      operationId: getNotificationPreferences
      tags: [accounts]
      responses:
        "200":
          description: Current account's email-alert preferences
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationPreferences"}
    patch:
      operationId: updateNotificationPreferences
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationPreferencesInput"}
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationPreferences"}
  /admin/integrations:
    get:
      operationId: getIntegrationSettings
      tags: [admin]
      responses:
        "200":
          description: Integration settings and recent email attempts, administrator only
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntegrationSettings"}
    patch:
      operationId: updateIntegrationSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IntegrationSettingsInput"}
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntegrationSettings"}
  /admin/integrations/check:
    post:
      operationId: refreshIntegrationStatus
      tags: [admin]
      responses:
        "200":
          description: Refreshed Web Risk connection health; does not send an email
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntegrationSettings"}
  /admin/integrations/test-email:
    post:
      operationId: sendTestEmail
      tags: [admin]
      responses:
        "202":
          description: Test email queued only to the current administrator's verified primary address
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmailDelivery"}
  /scans/pdf:
    post:
      operationId: uploadPdfScan
      tags: [scamfind]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/PdfScanInput"}
      responses:
        "201":
          description: PDF screened using its text layer and optional local English OCR; original PDF is not retained
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scan"}
        "422": {description: "Password protected, unreadable, excessive, or no readable text (including failed or declined OCR)"}
  /account:
    get:
      operationId: getAccount
      tags: [accounts]
      responses:
        "200":
          description: Signed-in account and server-enforced role
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "401": {description: Sign in required}
  /account/browser-scans:
    get:
      operationId: getBrowserScanCount
      tags: [accounts]
      responses:
        "200":
          description: Existing scans available to explicitly import
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CountResult"}
  /account/import-browser-scans:
    post:
      operationId: importBrowserScans
      tags: [accounts]
      responses:
        "200":
          description: Number of browser scans moved into the current account
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CountResult"}
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      responses:
        "200":
          description: Admin-only system-wide overview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminSummary"}
        "403": {description: Administrator access required}
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      responses:
        "200":
          description: Accounts visible to administrators
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Account"}}
  /admin/scans:
    get:
      operationId: listAdminScans
      tags: [admin]
      responses:
        "200":
          description: Account-owned cases for administrator review; excludes legacy anonymous scans
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/AdminCase"}}
  /admin/scans/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getAdminScan
      tags: [admin]
      responses:
        "200":
          description: Case evidence for authorized review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scan"}
    patch:
      operationId: updateAdminScan
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScanUpdate"}
      responses:
        "200":
          description: Reviewed case with audit entry
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scan"}
  /admin/scans/{id}/report:
    get:
      operationId: downloadAdminScanReport
      tags: [admin]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Administrator evidence PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /scans:
    get:
      operationId: listScans
      tags: [scamfind]
      responses:
        "200":
          description: Scans belonging only to the authenticated account
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Scan"}}
    post:
      operationId: createScan
      tags: [scamfind]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScanInput"}
      responses:
        "201":
          description: Completed screening
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scan"}
  /scans/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getScan
      tags: [scamfind]
      responses:
        "200":
          description: Evidence report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scan"}
    patch:
      operationId: updateScan
      tags: [scamfind]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScanUpdate"}
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scan"}
    delete:
      operationId: deleteScan
      tags: [scamfind]
      responses:
        "204": {description: Deleted}
  /scans/{id}/report:
    get:
      operationId: downloadScanReport
      tags: [scamfind]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Downloadable evidence screening PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /summary:
    get:
      operationId: getSummary
      tags: [scamfind]
      responses:
        "200":
          description: Personal screening activity
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Summary"}
  /providers:
    get:
      operationId: listProviders
      tags: [scamfind]
      responses:
        "200":
          description: Honest capability availability
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Provider"}}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ResendEventInput:
      type: object
      required: [type, created_at, data]
      properties:
        type: {type: string}
        created_at: {type: string}
        data:
          type: object
          required: [email_id]
          properties:
            email_id: {type: string, maxLength: 200}
    WebhookReceipt:
      type: object
      required: [received]
      properties:
        received: {type: boolean}
    NotificationPreferencesInput:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    PdfScanInput:
      type: object
      required: [file]
      properties:
        file: {type: string, format: binary}
        sender: {type: string, maxLength: 320}
        title: {type: string, maxLength: 160}
        checkLinks: {type: string, enum: ["true", "false"]}
        checkPhone: {type: string, enum: ["true", "false"]}
        phoneNumber: {type: string, maxLength: 40}
        phoneCountry: {type: string, pattern: "^[A-Za-z]{2}$"}
        localOcr:
          type: string
          enum: ["true", "false"]
          description: Optional per-document local English OCR. Defaults to false. No document bytes are sent to an external OCR service. Independent of link-check consent.
    NotificationPreferences:
      type: object
      required: [enabled, email, ready, message]
      properties:
        enabled: {type: boolean}
        email: {type: string}
        ready: {type: boolean}
        message: {type: string}
    IntegrationSettingsInput:
      type: object
      required: [senderEmail, senderName, emailEnabled]
      properties:
        senderEmail: {type: string, maxLength: 320}
        senderName: {type: string, minLength: 1, maxLength: 80}
        emailEnabled: {type: boolean}
    IntegrationSettings:
      type: object
      required: [senderEmail, senderName, emailEnabled, emailStatus, emailMessage, webRiskStatus, webRiskMessage, deliveries, deliveryTrackingConfigured]
      properties:
        senderEmail: {type: string}
        senderName: {type: string}
        emailEnabled: {type: boolean}
        emailStatus: {type: string, enum: [active, configured, not_connected, error]}
        emailMessage: {type: string}
        webRiskStatus: {type: string, enum: [active, configured, not_connected, error]}
        webRiskMessage: {type: string}
        deliveries: {type: array, items: {$ref: "#/components/schemas/EmailDelivery"}}
        deliveryTrackingConfigured: {type: boolean, description: Whether a webhook signing secret is configured; does not confirm provider setup.}
    EmailDelivery:
      type: object
      required: [id, type, status, createdAt, attempts, recipient, error, deliveryState, deliveryEventAt]
      properties:
        id: {type: string}
        type: {type: string, enum: [test, case_update]}
        status: {type: string, enum: [queued, sending, sent, failed, cancelled]}
        createdAt: {type: string}
        attempts: {type: integer}
        recipient: {type: string}
        error: {type: string}
        deliveryState: {type: string, enum: [unconfirmed, accepted, delayed, delivered, failed, suppressed, bounced, complained]}
        deliveryEventAt: {type: string, description: Verified provider event timestamp or an empty string when none is known.}
    UrlCheck:
      type: object
      required: [url, status, threatTypes, detail, checkedAt]
      properties:
        url: {type: string}
        status: {type: string, enum: [listed, not_listed, unavailable, skipped]}
        threatTypes: {type: array, items: {type: string}}
        detail: {type: string}
        checkedAt: {type: string}
    Account:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        role: {type: string, enum: [user, admin]}
        createdAt: {type: string}
    CountResult:
      type: object
      required: [count]
      properties:
        count: {type: integer}
    AdminCase:
      type: object
      required: [ownerId, ownerName, ownerEmail, scan]
      properties:
        ownerId: {type: string}
        ownerName: {type: string}
        ownerEmail: {type: string}
        scan: {$ref: "#/components/schemas/Scan"}
    AdminSummary:
      type: object
      required: [users, total, flagged, openCases, escalated, overdue, recent]
      properties:
        users: {type: integer}
        total: {type: integer}
        flagged: {type: integer}
        openCases: {type: integer}
        escalated: {type: integer}
        overdue: {type: integer}
        recent: {type: array, items: {$ref: "#/components/schemas/AdminCase"}}
    ScanInput:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 200000}
        sender: {type: string, maxLength: 320}
        title: {type: string, maxLength: 160}
        fileName: {type: string, maxLength: 255}
        checkLinks: {type: boolean, default: false}
        checkPhone: {type: boolean, default: false}
        phoneNumber: {type: string, maxLength: 40}
        phoneCountry: {type: string, pattern: "^[A-Za-z]{2}$"}
        source: {type: string, enum: [paste, upload, batch], default: paste}
    PhoneCheck:
      type: object
      required: [number, status, detail, checkedAt]
      properties:
        number: {type: string}
        status: {type: string, enum: [valid, invalid, unavailable, skipped]}
        detail: {type: string}
        checkedAt: {type: string}
        internationalFormat: {type: string}
        countryName: {type: string}
        countryCode: {type: string}
        carrier: {type: string}
        lineType: {type: string}
    ScanUpdate:
      type: object
      properties:
        status: {type: string, enum: [new, triaged, escalated, closed]}
        notes: {type: string, maxLength: 10000}
        feedback: {type: string, enum: [helpful, incorrect]}
    Signal:
      type: object
      required: [id, title, category, weight, evidence, description]
      properties:
        id: {type: string}
        title: {type: string}
        category: {type: string}
        weight: {type: integer}
        evidence: {type: string}
        description: {type: string}
    Check:
      type: object
      required: [name, status, detail]
      properties:
        name: {type: string}
        status: {type: string, enum: [passed, warning, unavailable, info]}
        detail: {type: string}
    TimelineEvent:
      type: object
      required: [at, description]
      properties:
        at: {type: string}
        description: {type: string}
    Scan:
      type: object
      required: [id, title, text, sender, domain, source, createdAt, score, verdict, confidence, status, notes, signals, checks, checklist, links, headers, hash, engineVersion, durationMs, timeline, feedback, dueAt]
      properties:
        id: {type: string}
        title: {type: string}
        text: {type: string}
        sender: {type: string}
        domain: {type: string}
        source: {type: string}
        createdAt: {type: string}
        score: {type: integer}
        verdict: {type: string, enum: [Likely genuine, Suspicious, Likely scam, Insufficient data]}
        confidence: {type: string}
        status: {type: string, enum: [new, triaged, escalated, closed]}
        notes: {type: string}
        feedback: {type: string}
        dueAt: {type: string}
        signals: {type: array, items: {$ref: "#/components/schemas/Signal"}}
        checks: {type: array, items: {$ref: "#/components/schemas/Check"}}
        checklist: {type: array, items: {type: string}}
        links: {type: array, items: {type: string}}
        headers: {type: string}
        hash: {type: string}
        engineVersion: {type: string}
        durationMs: {type: integer}
        timeline: {type: array, items: {$ref: "#/components/schemas/TimelineEvent"}}
        linkCheckRequested: {type: boolean}
        phoneCheckRequested: {type: boolean}
        phoneCheck: {$ref: "#/components/schemas/PhoneCheck"}
        urlChecks: {type: array, items: {$ref: "#/components/schemas/UrlCheck"}}
        pdfSource:
          type: object
          required: [fileName, pages, warning]
          properties:
            fileName: {type: string}
            pages: {type: integer}
            warning: {type: string}
    Summary:
      type: object
      required: [total, flagged, genuine, openCases, averageDurationMs, recent]
      properties:
        total: {type: integer}
        flagged: {type: integer}
        genuine: {type: integer}
        openCases: {type: integer}
        averageDurationMs: {type: integer}
        recent: {type: array, items: {$ref: "#/components/schemas/Scan"}}
    Provider:
      type: object
      required: [name, capability, status, description]
      properties:
        name: {type: string}
        capability: {type: string}
        status: {type: string, enum: [active, configured, not_connected, error]}
        description: {type: string}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

